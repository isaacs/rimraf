name: CI

on:
  push:
    branches: ["main"]
  pull_request_target:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - 'lib/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c -t0
        env:
          RIMRAF_TEST_START_CHAR: a
          RIMRAF_TEST_END_CHAR: f
          RIMRAF_TEST_DEPTH: 5
